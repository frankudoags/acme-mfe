services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: acme
    ports:
      - '3307:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-proot']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: mysql://root:root@mysql:3306/acme
    ports:
      - '8080:8080'
    depends_on:
      mysql:
        condition: service_healthy

  header:
    build:
      context: .
      dockerfile: apps/header/Dockerfile
    ports:
      - '5001:80'
    depends_on:
      - backend

  products:
    build:
      context: .
      dockerfile: apps/products/Dockerfile
    ports:
      - '5002:80'
    depends_on:
      - backend

  cart:
    build:
      context: .
      dockerfile: apps/cart/Dockerfile
    ports:
      - '5003:80'
    depends_on:
      - backend

  shell:
    build:
      context: .
      dockerfile: apps/shell/Dockerfile
      args:
        HEADER_REMOTE: http://localhost:5001/assets/remoteEntry.js
        PRODUCTS_REMOTE: http://localhost:5002/assets/remoteEntry.js
        CART_REMOTE: http://localhost:5003/assets/remoteEntry.js
    ports:
      - '5000:80'
    depends_on:
      - header
      - products
      - cart
      - backend

volumes:
  mysql_data:
